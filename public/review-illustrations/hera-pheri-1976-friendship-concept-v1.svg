<title id="art-title">Two allies, one concealed enemy — conceptual illustration for Hera Pheri (1976)</title>
<desc id="art-description">Original cinematic illustration of two fictional seventies-era friends, vintage architecture, a getaway car and a distant mysterious figure. Not a film still.</desc>
