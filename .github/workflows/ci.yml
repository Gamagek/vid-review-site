name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Portainer workflow expressions
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/portainer-deploy.yml
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload regression test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-output
          path: test-output.txt
          if-no-files-found: ignore
      - name: Check Teamwork Python syntax
        run: python -m compileall -q services/teamwork/app
      - name: Test Teamwork service
        run: |
          python -m pip install -r services/teamwork/requirements-dev.txt
          python -m pytest -q services/teamwork/tests
      - name: Validate the Worker bundle
        run: npm run check
      - name: Validate Portainer updater syntax
        run: node --check scripts/deploy-portainer.mjs
