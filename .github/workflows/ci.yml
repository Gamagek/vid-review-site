name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload regression test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-output
          path: test-output.txt
          if-no-files-found: ignore
      - name: Check Teamwork Python syntax
        run: python -m compileall -q services/teamwork/app
      - name: Test Teamwork service
        run: |
          python -m pip install -r services/teamwork/requirements-dev.txt
          python -m pytest -q services/teamwork/tests
      - name: Validate the Worker bundle
        run: npm run check
