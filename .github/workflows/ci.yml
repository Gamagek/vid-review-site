name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Portainer workflow expressions
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production Docker Compose without starting services
        run: docker compose -f ops/portainer/vidbest-v56.yaml config --quiet
        env:
          R2_ACCESS_KEY: compose-validation-placeholder
          R2_SECRET_KEY: compose-validation-placeholder
          SIGN_SECRET: compose-validation-placeholder
          TESTER_TOKEN: compose-validation-placeholder
          RAPIDAPI_KEY: compose-validation-placeholder
          CACHE_HOOK_SECRET: compose-validation-placeholder
          TUNNEL_TOKEN: compose-validation-placeholder
      - name: Run regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload regression test output on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regression-test-output
          path: test-output.txt
          if-no-files-found: ignore
      - name: Check Teamwork Python syntax
        run: python -m compileall -q services/teamwork/app
      - name: Test Teamwork service
        run: |
          python -m pip install -r services/teamwork/requirements-dev.txt
          python -m pytest -q services/teamwork/tests
      - name: Validate the Worker bundle
        run: npm run check
      - name: Validate Portainer updater syntax
        run: node --check scripts/deploy-portainer.mjs
      - name: Validate Search Console automation syntax
        run: node --check scripts/search-console-audit.mjs
