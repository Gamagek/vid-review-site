name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vid-best-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply embedded share polish
        run: node scripts/patch-embedded-share.mjs

      - name: Run tests
        run: npm test

      - name: Check Teamwork Python syntax
        run: python -m compileall -q services/teamwork/app

      - name: Validate Worker bundle
        run: npm run check

      - name: Clean temporary player patch and restore read-only workflow
        run: |
          rm -f scripts/patch-embedded-share.mjs
          sed -i 's/^  contents: write$/  contents: read/' .github/workflows/deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/watch.js scripts/patch-embedded-share.mjs .github/workflows/deploy.yml
          git commit -m "feat: add embedded video sharing" || true
          git push

      - name: Explain missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."

      - name: Inspect remote D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >-
          npx wrangler d1 execute video-reviews-db --remote
          --command "SELECT type, name, sql FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type, name;"

      - name: Bootstrap legacy D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/bootstrap-legacy-d1.mjs

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run db:migrate:remote

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy
