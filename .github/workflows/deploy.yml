name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vid-best-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply linked media player upgrade
        if: ${{ !contains(github.event.head_commit.message, 'fix: unify linked media player controls') }}
        shell: bash
        run: |
          cat >> public/watch.js <<'VIDBEST_PLAYER_UPGRADE'

          // VIDBEST LINKED PLAYER UPGRADE v1
          // Unifies native uploads, direct linked media, and supported external embeds.
          (() => {
            const player = document.querySelector('#watch-player');
            if (!player) return;

            const state = window.__vidBestPlayer = window.__vidBestPlayer || {
              remoteCurrentTime: 0,
              remoteDuration: 0,
              remotePlaying: false,
              provider: '',
            };

            function getStage() {
              return player.querySelector('.watch-player-stage') || player;
            }

            function getVideo() {
              return player.querySelector('video');
            }

            function inferProvider(frame) {
              const explicit = String(document.body.dataset.videoProvider || '').toLowerCase();
              if (explicit) return explicit;
              try {
                const host = new URL(frame?.src || '').hostname.toLowerCase();
                if (host.includes('youtube')) return 'youtube';
                if (host.includes('vimeo')) return 'vimeo';
                if (host.includes('dailymotion')) return 'dailymotion';
                if (host.includes('tiktok')) return 'tiktok';
                if (host.includes('facebook')) return 'facebook';
                if (host.includes('instagram')) return 'instagram';
                if (host.includes('twitch')) return 'twitch';
              } catch { /* Unknown provider. */ }
              return 'external';
            }

            function isDirectMediaUrl(value) {
              return /\.(?:mp4|webm|ogg|ogv|m4v|mov)(?:$|[?#])/i.test(String(value || ''));
            }

            function normalizeYouTubeFrame(frame) {
              if (!frame) return;
              try {
                const url = new URL(frame.src);
                url.searchParams.set('enablejsapi', '1');
                url.searchParams.set('playsinline', '1');
                url.searchParams.set('origin', location.origin);
                if (!url.searchParams.has('rel')) url.searchParams.set('rel', '0');
                if (!url.searchParams.has('cc_load_policy')) url.searchParams.set('cc_load_policy', '1');
                frame.src = url.toString();
              } catch { /* Keep provider URL unchanged if malformed. */ }
              frame.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; encrypted-media; accelerometer; clipboard-write');
              frame.setAttribute('allowfullscreen', '');
              frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
            }

            function maybeConvertDirectLinkedMedia() {
              const frame = player.querySelector('iframe');
              if (!frame || !isDirectMediaUrl(frame.src)) return;
              const video = document.createElement('video');
              video.controls = true;
              video.playsInline = true;
              video.preload = 'metadata';
              video.src = frame.src;
              video.setAttribute('aria-label', 'Linked video');
              frame.replaceWith(video);
            }

            function providerCommand(method, args = []) {
              const frame = player.querySelector('iframe');
              if (!frame) return;
              try {
                const provider = state.provider;
                if (provider === 'youtube') {
                  const targetOrigin = 'https://www.youtube.com';
                  frame.contentWindow?.postMessage(JSON.stringify({ event: 'command', func: method, args }), targetOrigin);
                  return;
                }
                if (provider === 'vimeo') {
                  let payload;
                  if (method === 'playVideo') payload = { method: 'play' };
                  else if (method === 'pauseVideo') payload = { method: 'pause' };
                  else if (method === 'mute') payload = { method: 'setVolume', value: 0 };
                  else if (method === 'unMute') payload = { method: 'setVolume', value: 1 };
                  else if (method === 'setPlaybackRate') payload = { method: 'setPlaybackRate', value: Number(args[0]) };
                  else if (method === 'seekTo') payload = { method: 'setCurrentTime', value: Number(args[0]) };
                  else payload = { method };
                  frame.contentWindow?.postMessage(JSON.stringify(payload), 'https://player.vimeo.com');
                }
              } catch (error) {
                console.debug('Provider command unavailable', error?.message || error);
              }
            }

            function sendProviderCommand(method, args = []) {
              providerCommand(method, args);
            }

            window.addEventListener('message', (event) => {
              const frame = player.querySelector('iframe');
              if (!frame || event.source !== frame.contentWindow) return;
              let data = event.data;
              if (typeof data !== 'string') return;
              try { data = JSON.parse(data); } catch { return; }

              if (state.provider === 'youtube' && data.event === 'infoDelivery' && data.info) {
                if (Number.isFinite(Number(data.info.currentTime))) state.remoteCurrentTime = Number(data.info.currentTime);
                if (Number.isFinite(Number(data.info.duration))) state.remoteDuration = Number(data.info.duration);
                if (Number.isFinite(Number(data.info.playerState))) state.remotePlaying = Number(data.info.playerState) === 1;
              }

              if (state.provider === 'vimeo' && ['timeupdate', 'playProgress'].includes(data.event)) {
                const seconds = Number(data.data?.seconds ?? data.data?.duration);
                if (Number.isFinite(seconds)) state.remoteCurrentTime = seconds;
                const duration = Number(data.data?.duration);
                if (Number.isFinite(duration)) state.remoteDuration = duration;
              }
            });

            function injectPlayerCss() {
              if (document.querySelector('#vidbest-player-upgrade-css')) return;
              const style = document.createElement('style');
              style.id = 'vidbest-player-upgrade-css';
              style.textContent = `
                #watch-player .player-tools { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-top:.75rem; }
                #watch-player .player-tools .button { min-height:40px; }
                #watch-player .player-tool-note { flex-basis:100%; margin:.15rem 0 0; }
                #watch-player.is-mini { z-index:1000; }
                #watch-player.is-mini iframe, #watch-player.is-mini video { min-height:180px; }
              `;
              document.head.append(style);
            }

            function button(label, title, handler, disabled = false) {
              const el = document.createElement('button');
              el.type = 'button';
              el.className = 'button ghost';
              el.textContent = label;
              el.title = title;
              el.setAttribute('aria-label', title);
              el.disabled = disabled;
              el.addEventListener('click', () => void handler());
              return el;
            }

            function setRemoteInfo() {
              const frame = player.querySelector('iframe');
              if (state.provider === 'youtube' && frame) {
                sendProviderCommand('getCurrentTime');
                sendProviderCommand('getDuration');
                sendProviderCommand('getPlayerState');
              }
            }

            function setupMediaSession(title, media) {
              if (!('mediaSession' in navigator)) return;
              try {
                navigator.mediaSession.metadata = new MediaMetadata({
                  title: title.slice(0, 120),
                  artist: 'Vid.Best',
                  album: 'Vid.Best Video Review',
                });
                const action = (name, fn) => {
                  try { navigator.mediaSession.setActionHandler(name, fn); } catch { /* Browser does not support this action. */ }
                };
                action('play', async () => {
                  if (media) await media.play(); else sendProviderCommand('playVideo');
                });
                action('pause', () => {
                  if (media) media.pause(); else sendProviderCommand('pauseVideo');
                });
                action('seekbackward', () => seekBy(-10));
                action('seekforward', () => seekBy(10));
                action('seekto', (event) => {
                  const target = Number(event?.seekTime);
                  if (!Number.isFinite(target)) return;
                  if (media) media.currentTime = target;
                  else sendProviderCommand('seekTo', [target, true]);
                });
                action('stop', () => {
                  if (media) media.pause(); else sendProviderCommand('pauseVideo');
                });
                action('enterpictureinpicture', async () => {
                  if (media && document.pictureInPictureEnabled && typeof media.requestPictureInPicture === 'function') {
                    try { await media.requestPictureInPicture(); } catch { /* Browser/provider declined PiP. */ }
                  }
                });
              } catch { /* Media Session is optional. */ }
            }

            function currentTime(media) {
              if (media) return Number(media.currentTime) || 0;
              setRemoteInfo();
              return Number(state.remoteCurrentTime) || 0;
            }

            function duration(media) {
              if (media && Number.isFinite(media.duration)) return media.duration;
              return Number(state.remoteDuration) || 0;
            }

            function seekBy(delta) {
              const media = getVideo();
              const next = Math.max(0, currentTime(media) + delta);
              const end = duration(media);
              const target = end > 0 ? Math.min(end, next) : next;
              if (media) media.currentTime = target;
              else if (state.provider === 'youtube' || state.provider === 'vimeo') sendProviderCommand('seekTo', [target, true]);
            }

            function setFloatingMode(enabled) {
              const anchor = document.querySelector('#watch-player-anchor');
              if (!anchor) return;
              if (enabled) {
                anchor.style.height = `${player.offsetHeight}px`;
                anchor.classList.add('is-active');
                player.classList.add('is-mini');
                player.dataset.explicitMini = '1';
                return;
              }
              player.classList.remove('is-mini');
              player.removeAttribute('data-explicit-mini');
              anchor.classList.remove('is-active');
              anchor.style.height = '';
            }

            function buildTools() {
              const existing = player.querySelector('.player-tools');
              existing?.remove();
              const media = getVideo();
              const frame = player.querySelector('iframe');
              const stage = getStage();
              if (!media && !frame) return;

              const tools = document.createElement('div');
              tools.className = 'watch-reactions player-tools';
              tools.setAttribute('aria-label', 'Video playback controls');
              const provider = state.provider;
              const remoteSupported = ['youtube', 'vimeo'].includes(provider);

              const rewind = button('↶ 10s', 'Rewind 10 seconds', () => seekBy(-10), !media && !remoteSupported);
              const playPause = button('▶ Play', 'Play or pause', async () => {
                if (media) {
                  if (media.paused) await media.play(); else media.pause();
                } else if (remoteSupported) {
                  if (state.remotePlaying) sendProviderCommand('pauseVideo'); else sendProviderCommand('playVideo');
                  setTimeout(setRemoteInfo, 150);
                }
              });
              const forward = button('10s ↷', 'Forward 10 seconds', () => seekBy(10), !media && !remoteSupported);
              const speed = button('1× speed', 'Cycle playback speed', () => {
                const rates = [0.5, 0.75, 1, 1.25, 1.5, 2];
                const current = media ? Number(media.playbackRate || 1) : Number(state.remoteRate || 1);
                let index = rates.findIndex((value) => Math.abs(value - current) < 0.01);
                index = (index + 1) % rates.length;
                const next = rates[index];
                if (media) media.playbackRate = next;
                else { state.remoteRate = next; if (provider === 'youtube' || provider === 'vimeo') sendProviderCommand('setPlaybackRate', [next]); }
                speed.textContent = `${next}× speed`;
              }, !media && !remoteSupported);
              const zoom = button('1× zoom', 'Cycle video zoom', () => {
                const values = [1, 1.25, 1.5, 2];
                const current = Number(player.dataset.zoom || 1);
                let index = values.findIndex((value) => Math.abs(value - current) < 0.01);
                index = (index + 1) % values.length;
                const next = values[index];
                player.dataset.zoom = String(next);
                const target = media || frame;
                if (target) target.style.transform = `scale(${next})`;
                zoom.textContent = `${next}× zoom`;
              });

              const captions = button('CC', 'Captions', () => {
                if (media) {
                  const tracks = [...media.textTracks];
                  if (!tracks.length) { setPlayerMessage('No stored caption track is available yet.'); return; }
                  const showing = tracks.some((track) => track.mode === 'showing');
                  tracks.forEach((track, index) => { track.mode = !showing && index === 0 ? 'showing' : 'hidden'; });
                  captions.textContent = showing ? 'CC off' : 'CC on';
                } else if (provider === 'youtube') {
                  setPlayerMessage('YouTube captions are enabled in the provider player; use its CC control to choose the language.');
                  frame?.focus();
                } else {
                  setPlayerMessage('Caption control is supplied by the linked provider.');
                }
              }, !media && !frame);

              const translate = button('Translate', 'Translate captions', () => setPlayerMessage('Translation becomes available when Vid.Best receives a caption track from the Teamwork transcription/translation engine.'), true);
              const mute = button(media?.muted ? 'Unmute' : 'Mute', 'Mute or unmute', () => {
                if (media) {
                  media.muted = !media.muted;
                  mute.textContent = media.muted ? 'Unmute' : 'Mute';
                } else if (provider === 'youtube' || provider === 'vimeo') {
                  if (state.remoteMuted) { sendProviderCommand('unMute'); state.remoteMuted = false; mute.textContent = 'Mute'; }
                  else { sendProviderCommand('mute'); state.remoteMuted = true; mute.textContent = 'Unmute'; }
                } else setPlayerMessage('Mute control is supplied by the linked provider.');
              });

              const popout = button('Pop-out', 'Open the video in the floating player', () => {
                const enabled = !player.classList.contains('is-mini');
                setFloatingMode(enabled);
                popout.textContent = enabled ? 'Return' : 'Pop-out';
              });

              const pip = button('▣ PiP', 'Picture in picture', async () => {
                if (!media || !document.pictureInPictureEnabled || typeof media.requestPictureInPicture !== 'function') {
                  setPlayerMessage('Browser Picture-in-Picture is available for native/direct media when your browser supports it. For linked providers, use Pop-out or the provider’s PiP control.');
                  return;
                }
                try {
                  if (document.pictureInPictureElement) await document.exitPictureInPicture();
                  else await media.requestPictureInPicture();
                } catch (error) {
                  console.debug('PiP request declined', error?.message || error);
                  setPlayerMessage('Picture-in-Picture was not available in this browser/session.');
                }
              }, !media);

              const fullscreen = button('Fullscreen', 'Toggle fullscreen', async () => {
                try {
                  if (document.fullscreenElement) await document.exitFullscreen();
                  else if (stage.requestFullscreen) await stage.requestFullscreen();
                } catch (error) {
                  setPlayerMessage('Fullscreen is unavailable for this linked provider.');
                  console.debug(error?.message || error);
                }
              });
              const share = button('Share', 'Share this video', () => { if (typeof shareWatchPage === 'function') void shareWatchPage(); });

              tools.append(rewind, playPause, forward, speed, zoom, captions, translate, mute, popout, pip, fullscreen, share);

              const note = document.createElement('p');
              note.className = 'form-status player-tool-note';
              note.textContent = media
                ? 'Full native controls: seek, speed, captions, mute, floating player, Picture-in-Picture and fullscreen. Background playback follows browser/device policy.'
                : provider === 'youtube' || provider === 'vimeo'
                  ? `Linked ${provider} player: playback, seek, speed and floating player controls are synchronized where the provider API permits them. Provider restrictions still apply.`
                  : 'Linked provider controls remain available. Pop-out, fullscreen and sharing are provided by Vid.Best; advanced remote controls depend on the provider API.';
              tools.append(note);
              stage.insertAdjacentElement('afterend', tools);

              if (media) {
                media.addEventListener('play', () => { playPause.textContent = '❚❚ Pause'; state.remotePlaying = true; });
                media.addEventListener('pause', () => { playPause.textContent = '▶ Play'; state.remotePlaying = false; });
                media.addEventListener('ratechange', () => { speed.textContent = `${Number(media.playbackRate || 1)}× speed`; });
                setupMediaSession(document.title, media);
              } else {
                state.provider = provider;
                setupMediaSession(document.title, null);
                const poll = setInterval(setRemoteInfo, 1200);
                setTimeout(() => clearInterval(poll), 30000);
              }
            }

            function setPlayerMessage(message) {
              const note = player.querySelector('.player-tool-note');
              if (note) note.textContent = message;
            }

            // Re-declare these functions after the legacy declarations so existing page code uses the upgraded behavior.
            window.__vidBestEnhancedPlayer = true;
            maybeConvertDirectLinkedMedia();
            const frame = player.querySelector('iframe');
            state.provider = inferProvider(frame);
            if (state.provider === 'youtube') normalizeYouTubeFrame(frame);
            injectPlayerCss();
            buildTools();

            const restoreButton = player.querySelector('[data-player-mode="restore"]');
            restoreButton?.addEventListener('click', () => setFloatingMode(false), { capture: true });

            window.addEventListener('beforeunload', () => {
              try { navigator.mediaSession?.setPositionState?.({ duration: Math.max(1, duration(getVideo())), playbackRate: getVideo()?.playbackRate || 1, position: Math.min(duration(getVideo()) || 0, currentTime(getVideo())) }); } catch { /* optional */ }
            });
          })();

          VIDBEST_PLAYER_UPGRADE

      - name: Run tests
        run: npm test

      - name: Check Teamwork Python syntax
        run: python -m compileall -q services/teamwork/app

      - name: Validate Worker bundle
        run: npm run check

      - name: Commit linked media player upgrade
        if: ${{ !contains(github.event.head_commit.message, 'fix: unify linked media player controls') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/watch.js
          git commit -m "fix: unify linked media player controls"
          git push

      - name: Explain missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."

      # Read-only preflight: prints the current D1 schema before any migration is attempted.
      - name: Inspect remote D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >-
          npx wrangler d1 execute video-reviews-db --remote
          --command "SELECT type, name, sql FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type, name;"

      - name: Bootstrap legacy D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/bootstrap-legacy-d1.mjs

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run db:migrate:remote

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy
