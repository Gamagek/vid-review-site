name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vid-best-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply admin login rate-limit fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/index.js")
          text = path.read_text(encoding="utf-8")
          old = "async function assertLoginAllowed(request, env) {\n  const fingerprint = await requestFingerprint(request, env.ADMIN_SECRET_KEY);"
          new = "async function assertLoginAllowed(request, env) {\n  const fingerprint = await requestFingerprint(request, await resolveReactionSalt(env));"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Expected admin login rate-limit implementation was not found; refusing to continue.")
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Teamwork Python syntax
        run: python -m compileall -q services/teamwork/app

      - name: Validate Worker bundle
        run: npm run check

      - name: Commit authentication fix if needed
        run: |
          if git diff --quiet -- src/index.js; then
            echo "Admin authentication fix is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: separate admin auth secret from rate-limit salt"
          git push origin HEAD:main

      - name: Explain missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."

      # Read-only preflight: prints the current D1 schema before any migration is attempted.
      - name: Inspect remote D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >-
          npx wrangler d1 execute video-reviews-db --remote
          --command "SELECT type, name, sql FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type, name;"

      - name: Bootstrap legacy D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/bootstrap-legacy-d1.mjs

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run db:migrate:remote

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy
