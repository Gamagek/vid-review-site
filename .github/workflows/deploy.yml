name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vid-best-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply one-time player and category patches
        run: |
          if [ -f scripts/patch-embedded-share.mjs ]; then
            node scripts/patch-embedded-share.mjs
          else
            echo "No one-time patch file present; using committed source."
          fi

      - name: Run tests
        run: npm test

      - name: Check Teamwork Python syntax
        run: python -m compileall -q services/teamwork/app

      - name: Validate Worker bundle
        run: npm run check

      - name: Commit generated patches when present
        run: |
          if [ -f scripts/patch-embedded-share.mjs ]; then
            rm -f scripts/patch-embedded-share.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/watch.js public/index.html src/index.js .github/workflows/deploy.yml scripts/patch-embedded-share.mjs
            git commit -m "feat: add embedded sharing and spirituality categories"
            git push
          else
            echo "No generated patch commit required."
          fi

      - name: Explain missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."

      - name: Inspect remote D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >-
          npx wrangler d1 execute video-reviews-db --remote
          --command "SELECT type, name, sql FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type, name;"

      - name: Bootstrap legacy D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/bootstrap-legacy-d1.mjs

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run db:migrate:remote

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy
