name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vid-best-production
  cancel-in-progress: false

jobs:
  deploy:
    # Infrastructure verification commits must not run D1 migrations or publish a Worker.
    if: ${{ !contains(github.event.head_commit.message, '[read-only-preflight]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      # An exhausted D1 daily quota must not block a schema-neutral Worker fix.
      # If the previous commit cannot be inspected, fail closed to the old migration path.
      - name: Detect schema-affecting changes
        id: database
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "schema_changes=true" >> "$GITHUB_OUTPUT"
            echo "content_only_migration=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changes="$(git diff --name-only "$BEFORE_SHA" HEAD)"
          migration_changes="$(printf '%s\n' "$changes" | grep '^migrations/' || true)"
          migration_count="$(printf '%s\n' "$migration_changes" | grep -c . || true)"
          other_schema_changes="$(printf '%s\n' "$changes" | grep -E '^(scripts/bootstrap-legacy-d1\.mjs$|wrangler\.toml$)' || true)"
          if [[ "$migration_count" -eq 1 && "$migration_changes" == "migrations/0050_five_comedy_review_refresh.sql" && -z "$other_schema_changes" ]]; then
            echo "schema_changes=true" >> "$GITHUB_OUTPUT"
            echo "content_only_migration=true" >> "$GITHUB_OUTPUT"
            echo "Detected the guarded content-only review refresh; avoid broad schema reads."
          elif printf '%s\n' "$changes" | grep -Eq '^(migrations/|scripts/bootstrap-legacy-d1\.mjs$|wrangler\.toml$)'; then
            echo "schema_changes=true" >> "$GITHUB_OUTPUT"
            echo "content_only_migration=false" >> "$GITHUB_OUTPUT"
          else
            echo "schema_changes=false" >> "$GITHUB_OUTPUT"
            echo "content_only_migration=false" >> "$GITHUB_OUTPUT"
            echo "Code-only deployment: remote D1 reads and migrations are unnecessary."
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Teamwork Python syntax
        run: python -m compileall -q services/teamwork/app

      - name: Validate Worker bundle
        run: npm run check

      - name: Explain missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."

      # This guarded, content-only update has no schema change; don't run broad schema reads first.
      - name: Apply guarded content-only review refresh
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.database.outputs.content_only_migration == 'true'
        run: npx wrangler d1 execute video-reviews-db --remote --file migrations/0050_five_comedy_review_refresh.sql

      - name: Inspect remote D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.database.outputs.schema_changes == 'true' && steps.database.outputs.content_only_migration != 'true'
        run: >-
          npx wrangler d1 execute video-reviews-db --remote
          --command "SELECT type, name, sql FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type, name;"

      - name: Bootstrap legacy D1 schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.database.outputs.schema_changes == 'true' && steps.database.outputs.content_only_migration != 'true'
        run: node scripts/bootstrap-legacy-d1.mjs

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.database.outputs.schema_changes == 'true' && steps.database.outputs.content_only_migration != 'true'
        run: npm run db:migrate:remote

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy

      - name: Verify the published review illustration batch
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && contains(github.event.head_commit.message, '[review-art-publish]')
        run: node scripts/verify-review-illustrations.mjs --batch=latest

      - name: Save exact live image and page verification evidence
        if: always() && contains(github.event.head_commit.message, '[review-art-publish]')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: review-illustration-live-verification
          path: review-illustration-verification.json
          if-no-files-found: error
          retention-days: 14
