name: Public Shorts Metadata (research only)
on:
  push:
    branches:
      - research/shorts-public-metadata-20261019
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Read official public oEmbed metadata, with optional alternative
        run: node scripts/shorts-public-metadata.mjs
