name: TikTok player regression (isolated branch)
on:
  push:
    branches:
      - fix/tiktok-official-first-20261022
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test all regression suites
        run: npm test
      - name: Check bundle compilation
        run: npm run check
