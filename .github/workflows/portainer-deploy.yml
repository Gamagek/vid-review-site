name: Portainer production stack (after tests)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      read_only:
        description: Run validation and preflight without deploying production
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vidbest-portainer-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production Docker Compose without starting services
        run: docker compose -f ops/portainer/vidbest-v56.yaml config --quiet
        env:
          R2_ACCESS_KEY: compose-validation-placeholder
          R2_SECRET_KEY: compose-validation-placeholder
          SIGN_SECRET: compose-validation-placeholder
          TESTER_TOKEN: compose-validation-placeholder
          RAPIDAPI_KEY: compose-validation-placeholder
          CACHE_HOOK_SECRET: compose-validation-placeholder
          TUNNEL_TOKEN: compose-validation-placeholder
      - name: Run regression tests
        run: npm test
      - name: Validate Worker compilation
        run: npm run check
      - name: Check deployment updater syntax
        run: node --check scripts/deploy-portainer.mjs
      - name: Validate optional v5 scripts
        run: |
          node --check scripts/deploy-portainer-v5-addon.mjs
          node --check scripts/portainer-v5-addon.mjs
          node --check ops/portainer/legacy-v5-server.cjs
      - name: Verify Teamwork Python
        run: python -m compileall -q services/teamwork/app

  preflight:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: portainer-production
    env:
      PORTAINER_URL: ${{ vars.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
      PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
      PORTAINER_STACK_FILE: ${{ vars.PORTAINER_STACK_FILE || 'ops/portainer/vidbest-v56.yaml' }}
      PORTAINER_TLS_CA_PEM: ${{ secrets.PORTAINER_TLS_CA_PEM }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      # Verified via Cloudflare API; SHA-256 of Client ID, never the credential itself.
      # Token: VidBest-GitHub-AutoDeploy (530a942e-7c6f-4740-96c3-5a029e9e59ab).
      CF_ACCESS_EXPECTED_CLIENT_ID_SHA256: 56c5a83d48d7c327d48b58dc9f0d2979c3ab99cf3459baa125c73371f17e4ba1
      PORTAINER_BACKUP_ENCRYPTION_KEY: ${{ secrets.PORTAINER_BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure encrypted backup path
        run: echo "PORTAINER_BACKUP_FILE=$RUNNER_TEMP/portainer-preflight-backup.enc.json" >> "$GITHUB_ENV"
      - name: Configure optional trusted Portainer CA
        if: env.PORTAINER_TLS_CA_PEM != ''
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$PORTAINER_TLS_CA_PEM" > "$RUNNER_TEMP/portainer-ca.pem"
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/portainer-ca.pem" >> "$GITHUB_ENV"
      - name: Check Service Auth and Portainer stack in read-only mode
        id: preflight
        run: node scripts/deploy-portainer.mjs --check-only
      - name: Save encrypted read-only backup
        # Keep an authenticated backup even if the later live Docker GET fails.
        if: ${{ always() && steps.preflight.outputs.backup_created == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portainer-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PORTAINER_BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Verify public Worker and gateway without writes
        if: ${{ always() }}
        run: node scripts/verify-production-health.mjs

  deploy:
    needs: [validate, preflight]
    if: ${{ vars.PORTAINER_AUTO_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.read_only == false) && !contains(github.event.head_commit.message, '[read-only-preflight]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: portainer-production
    env:
      PORTAINER_URL: ${{ vars.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
      PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
      PORTAINER_STACK_FILE: ${{ vars.PORTAINER_STACK_FILE || 'ops/portainer/vidbest-v56.yaml' }}
      PORTAINER_TLS_CA_PEM: ${{ secrets.PORTAINER_TLS_CA_PEM }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CF_ACCESS_EXPECTED_CLIENT_ID_SHA256: 56c5a83d48d7c327d48b58dc9f0d2979c3ab99cf3459baa125c73371f17e4ba1
      PORTAINER_AUTO_DEPLOY_ENABLED: ${{ vars.PORTAINER_AUTO_DEPLOY_ENABLED }}
      PORTAINER_BACKUP_ENCRYPTION_KEY: ${{ secrets.PORTAINER_BACKUP_ENCRYPTION_KEY }}
      PORTAINER_HEALTH_TIMEOUT_SECONDS: 480
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure encrypted backup path
        run: echo "PORTAINER_BACKUP_FILE=$RUNNER_TEMP/portainer-backup.enc.json" >> "$GITHUB_ENV"
      - name: Configure optional trusted Portainer CA
        if: env.PORTAINER_TLS_CA_PEM != ''
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$PORTAINER_TLS_CA_PEM" > "$RUNNER_TEMP/portainer-ca.pem"
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/portainer-ca.pem" >> "$GITHUB_ENV"
      - name: Prepare current deployment backup without writes
        run: node scripts/deploy-portainer.mjs --check-only
      - name: Save encrypted rollback backup before production writes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portainer-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PORTAINER_BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 14
      - name: Update existing stack 27 and verify completion and health
        run: node scripts/deploy-portainer.mjs --deploy

  deploy_v5_addon:
    name: Deploy optional v5 internal services (one-time, live-merge)
    needs: [validate, preflight]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-v5-addons]') && vars.PORTAINER_AUTO_DEPLOY_ENABLED != 'true' && !contains(github.event.head_commit.message, '[read-only-preflight]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: portainer-production
    env:
      PORTAINER_URL: ${{ vars.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
      PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PORTAINER_BACKUP_ENCRYPTION_KEY: ${{ secrets.PORTAINER_BACKUP_ENCRYPTION_KEY }}
      PORTAINER_ADDON_ACTIVATION: 'true'
      PORTAINER_TLS_CA_PEM: ${{ secrets.PORTAINER_TLS_CA_PEM }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set isolated encrypted rollback backup path
        run: echo "PORTAINER_BACKUP_FILE=$RUNNER_TEMP/portainer-v5-addon-backup.enc.json" >> "$GITHUB_ENV"
      - name: Configure optional trusted Portainer CA
        if: env.PORTAINER_TLS_CA_PEM != ''
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$PORTAINER_TLS_CA_PEM" > "$RUNNER_TEMP/portainer-ca.pem"
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/portainer-ca.pem" >> "$GITHUB_ENV"
      - name: Check live v55 stack, preserved services and optional v5 overlay
        run: node scripts/deploy-portainer-v5-addon.mjs --check-only
      - name: Save encrypted original live YAML and environment before any writes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portainer-v5-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PORTAINER_BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 14
      - name: Add optional v5 services and verify post-deployment health
        run: node scripts/deploy-portainer-v5-addon.mjs --deploy

  audit_524:
    name: Read-only Portainer 524 incident status
    needs: validate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-524]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: portainer-production
    env:
      PORTAINER_URL: ${{ vars.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read stack and container status without changes
        run: node scripts/portainer-524-audit.mjs
