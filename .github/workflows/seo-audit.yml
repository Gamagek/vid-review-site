name: Review indexing audit

on:
  push:
    branches: [main]
    paths:
      - scripts/search-console-audit.mjs
      - scripts/thumbnail-audit.mjs
      - .github/workflows/seo-audit.yml
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      thumbnails_only:
        description: Check published thumbnails without calling Google APIs
        type: boolean
        default: false
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'vidbest-discovery-diagnostics' || inputs.thumbnails_only && 'vidbest-thumbnail-audit' || 'vidbest-search-console-audit' }}
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Audit published thumbnail HTTP availability without credentials
        run: node scripts/thumbnail-audit.mjs

      - name: Audit public pages and synchronize Search Console when configured
        if: ${{ !inputs.thumbnails_only }}
        run: node scripts/search-console-audit.mjs
        env:
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ vars.GOOGLE_SEARCH_CONSOLE_PROPERTY || 'sc-domain:vid.best' }}
          GOOGLE_SEARCH_CONSOLE_INSPECTIONS: ${{ github.event_name == 'push' && '0' || '200' }}
      - name: Publish concise indexing summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f thumbnail-audit-summary.txt ]; then
            cat thumbnail-audit-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f seo-audit-summary.txt ]; then
            cat seo-audit-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save credential-free technical and indexing reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vidbest-seo-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            thumbnail-audit-report.json
            thumbnail-audit-summary.txt
            seo-audit-report.json
            seo-audit-summary.txt
          if-no-files-found: error
          retention-days: 14
