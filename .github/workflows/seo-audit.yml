name: Review indexing audit

on:
  push:
    branches: [main]
    paths:
      - scripts/search-console-audit.mjs
      - scripts/thumbnail-audit.mjs
      - .github/workflows/seo-audit.yml
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      thumbnails_only:
        description: Check published thumbnails without calling Google APIs
        type: boolean
        default: false
      submit_sitemaps:
        description: Resubmit the public root and review sitemaps to Google
        type: boolean
        default: false
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'vidbest-discovery-diagnostics' || github.event_name == 'workflow_run' && 'vidbest-deployment-diagnostics' || inputs.thumbnails_only && 'vidbest-thumbnail-audit' || 'vidbest-search-console-audit' }}
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify deployed gratitude cover and stale public poster address
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const cover = 'https://vid.best/review-covers/remembering-kindness-illustrated-v1.webp';
          const image = await fetch(cover, {redirect:'manual', signal:AbortSignal.timeout(15000)});
          const type = (image.headers.get('content-type') || '').split(';')[0];
          assert.equal(image.status, 200); assert.equal(type, 'image/webp');
          assert.equal(Number(image.headers.get('content-length')), 91398);
          await image.body?.cancel();
          const old = await fetch('https://vid.best/api/facebook/thumbnail?id=160&v=old-version', {redirect:'manual', signal:AbortSignal.timeout(15000)});
          const location = old.headers.get('location');
          if (old.status === 302) {
            const target = new URL(location);
            assert.equal(target.origin, 'https://vid.best');
            assert.match(target.pathname, /^\/(?:review-covers|facebook-previews|media)\/.+\.(?:jpe?g|png|webp|avif|gif)$/i);
            assert.equal(target.search, ''); assert.equal(target.hash, '');
          }
          // Owner cover edits may change this destination; report rather than overwrite or fail them.
          await old.body?.cancel();
          console.log(JSON.stringify({hostedCoverStatus:image.status,contentType:type,bytes:91398,stalePosterStatus:old.status,redirectMatchesIllustration:location === cover}));
          JS

      - name: Audit published thumbnail HTTP availability without credentials
        run: node scripts/thumbnail-audit.mjs

      - name: Audit public pages and synchronize Search Console when configured
        if: ${{ !inputs.thumbnails_only }}
        run: node scripts/search-console-audit.mjs
        env:
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ vars.GOOGLE_SEARCH_CONSOLE_PROPERTY || 'sc-domain:vid.best' }}
          # Only the daily audit or an explicit manual request resubmits sitemaps.
          GOOGLE_SEARCH_CONSOLE_SUBMIT_SITEMAPS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.submit_sitemaps) && 'true' || 'false' }}
          # Daily/manual audits inspect URLs; deployment/push diagnostics use zero inspections.
          GOOGLE_SEARCH_CONSOLE_INSPECTIONS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '200' || '0' }}
      - name: Verify original editorial video identities and source JPEG posters
        if: ${{ github.event_name == 'workflow_run' && contains(github.event.workflow_run.head_commit.message, '[daily-weekly-best-publish]') }}
        run: node scripts/verify-daily-weekly-best-sources.mjs
      - name: Submit verified new editorial pages through supported Search Console APIs
        # The publication commit deliberately opts in once; ordinary diagnostics do not resubmit.
        if: ${{ github.event_name == 'workflow_run' && contains(github.event.workflow_run.head_commit.message, '[daily-weekly-best-publish]') }}
        run: node scripts/publish-daily-weekly-best.mjs
        env:
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ vars.GOOGLE_SEARCH_CONSOLE_PROPERTY || 'sc-domain:vid.best' }}
      - name: Publish concise indexing summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f thumbnail-audit-summary.txt ]; then
            cat thumbnail-audit-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f seo-audit-summary.txt ]; then
            cat seo-audit-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f daily-weekly-best-google-summary.txt ]; then
            cat daily-weekly-best-google-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save credential-free technical and indexing reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vidbest-seo-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            thumbnail-audit-report.json
            thumbnail-audit-summary.txt
            seo-audit-report.json
            seo-audit-summary.txt
            daily-weekly-best-google-report.json
            daily-weekly-best-google-summary.txt
            daily-weekly-best-source-report.json
          if-no-files-found: error
          retention-days: 14
