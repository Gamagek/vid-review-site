name: TikTok Lite Link Resolver (research only)
on:
  push:
    branches:
      - research/tiktok-lite-short-resolve-20261019
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Resolve public TikTok Lite links and TikTok oEmbed metadata
        run: node scripts/tiktok-lite-public-resolve.mjs
