name: One-time Gemini editorial live test
on:
  pull_request:
    types: [opened]
    paths:
      - content/editorial-evidence/live-test-20261026-349.json
      - .github/workflows/editorial-live-evidence-once.yml
permissions:
  contents: read
concurrency:
  group: editorial-live-349-20261026
  cancel-in-progress: false
jobs:
  evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'editorial/live-evidence-349-20261026' && github.event.pull_request.user.login == 'Gamagek'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Validate the tested pipeline
        run: node --test test/editorial-pipeline.test.js
      - name: Install media tools from official package registries
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python3 -m pip install 'yt-dlp[default]==2026.10.21'
      - name: Analyze only the owner-authorized exact source for review 349
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          VIDBEST_GEMINI_JOURNAL: ${{ runner.temp }}/vidbest-gemini-files.json
        run: node scripts/gemini-video-evidence.mjs --catalog content/editorial-evidence/live-test-20261026-349.json --video-id 349 --model gemini-3.8-flash --limit 1 --output-dir editorial-output
      - name: Remove temporary local media
        if: always()
        run: find "${TMPDIR:-/tmp}" -maxdepth 1 -type d -name 'vidbest-editorial-*' -exec rm -rf -- {} +
      - name: Delete run-owned Gemini files
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDBEST_GEMINI_JOURNAL: ${{ runner.temp }}/vidbest-gemini-files.json
        run: node scripts/cleanup-editorial-files.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: editorial-live-evidence-349
          path: editorial-output/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
