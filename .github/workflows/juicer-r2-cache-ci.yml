name: Juicer R2 cache verification (isolated)
on:
  push:
    branches:
      - feat/juicer-r2-metadata-cache-20261023
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test Juicer cache module
        run: node --test test/juicer-feed-cache.test.js
      - name: Run full repository tests
        run: npm test
      - name: Verify Wrangler bundle without deploying
        run: npm run check
