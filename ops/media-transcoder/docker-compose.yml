services:
  media-transcoder:
    build: .
    container_name: vidbest-media-transcoder
    restart: unless-stopped
    ports:
      - "8789:8789"
    environment:
      SERVICE_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
      RESULT_BASE_URL: "https://transcoder.example.com"
      ALLOWED_SOURCE_HOSTS: "vid.best"
      RESULT_MAX_BYTES: "99614720"
    volumes:
      - ./data:/data
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
