server {
    listen 8080;
    server_name _;
    server_tokens off;
    location = /health { proxy_pass http://legacy-v5:8080/health; proxy_connect_timeout 5s; proxy_read_timeout 15s; }
    location = /watch { proxy_pass http://legacy-v5:8080/watch; proxy_connect_timeout 5s; proxy_read_timeout 30s; }
    location = /metadata { proxy_pass http://legacy-v5:8080/metadata; proxy_connect_timeout 5s; proxy_read_timeout 30s; }
    location / { return 404; }
    add_header X-Content-Type-Options nosniff always;
}