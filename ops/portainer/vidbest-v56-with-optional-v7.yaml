            <button id="run">Run API Test</button><button id="config" type="button">Show Usage &amp; Config</button>
            <pre id="output" role="status" aria-live="polite">Ready. Each provider call counts against the monthly tester budget.</pre></main><script>
            const out=document.getElementById('output');
            async function check(config){const token=document.getElementById('token').value;const video=document.getElementById('video').value;
