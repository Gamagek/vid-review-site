          }

          text(res, 404, "Not Found");
        } catch (error) {
          lastStatus = "Gateway handler error: " + String(error && error.message ? error.message : error);
          if (!res.headersSent) text(res, 500, "Gateway Error");
          else res.end();
        }
      }

      http.createServer(handle).listen(PORT, "0.0.0.0", () => {
        console.log("Vid.Best Gateway " + VERSION + " running on port " + PORT);
      });
      VIDBEST_GATEWAY_JS
