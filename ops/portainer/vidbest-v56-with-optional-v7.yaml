          function showBar() {
            if ((document.body.className || "").indexOf("b") === -1) {
              document.body.className = document.body.className ? document.body.className + " b" : "b";
            }
          }
        
          function finish() {
            done = true;
            stop();
            say("");
            showBar();
          }
        
          function load() {
            playing = false;
            if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
            frame = document.createElement("iframe");
            frame.src = cfg.urls[attempt];
            frame.title = "TikTok video player";
            frame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
            frame.setAttribute("allowfullscreen", "");
            box.appendChild(frame);
            var last = attempt >= cfg.urls.length - 1;
            timer = setTimeout(function () {
              if (last) finish();
              else retry(false);
            }, cfg.wait);
          }
        
          function retry(hard) {
            if (done) return;
            stop();
            if (attempt >= cfg.urls.length - 1) {
              finish();
              return;
            }
            if (!hard && document.activeElement === frame) return;
            say("Reconnecting to TikTok... " + (attempt + 2) + "/" + cfg.urls.length);
            timer = setTimeout(function () {
              attempt += 1;
              load();
            }, cfg.retryBase * (attempt + 1) + Math.floor(Math.random() * cfg.retryJitter));
          }
        
          window.addEventListener("message", function (event) {
            if (done || !frame || event.source !== frame.contentWindow) return;
            var data = event.data;
            if (typeof data === "string") {
              try { data = JSON.parse(data); } catch (_) { return; }
            }
            if (!data || !data["x-tiktok-player"]) return;
        
            if (data.type === "onPlayerReady") {
              stop();
              say("");
              return;
            }
        
            if (data.type === "onStateChange") {
              playing = data.value === 1 || data.value === 3;
              return;
            }
        
            if (data.type === "onPlayerError") {
              var value = data.value || {};
              var code = Number(value.errorCode || data.errorCode || 0);
              var kind = String(value.errorType || data.errorType || "");
              if (code === 1001 || kind === "INVALID_VIDEO") {
                finish();
                return;
              }
              if (code === 3002 || kind === "AUTOPLAY_ERROR") return;
              if (!playing) retry(true);
            }
          });
        
          load();
          setTimeout(showBar, cfg.reveal);
        }
        
        function playerPage(id, user) {
          const player = "https://www.tiktok.com/player/v1/" + id;
          const embed = "https://www.tiktok.com/embed/v2/" + id;
          const candidates = RETRY ? [player, embed] : [player];
          const cfg = {
            urls: candidates.slice(0, MAX_ATTEMPTS),
            wait: WAIT_MS,
            reveal: REVEAL_MS,
            retryBase: RETRY_BASE_MS,
            retryJitter: RETRY_JITTER_MS,
          };
          const open = user ? "https://www.tiktok.com/@" + user + "/video/" + id : "";
          const bar = open
            ? '<a id="o" href="' + esc(open) + '" target="_blank" rel="noopener noreferrer">Watch on TikTok</a>'
            : '<div id="o">If this video does not play, please try again in a minute.</div>';
          const css = "html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px/1.3 sans-serif}"
            + "#v{position:absolute;top:0;left:0;right:0;bottom:0}"
            + "body.b #v{bottom:30px}"
            + "iframe{display:block;border:0;width:100%;height:100%}"
            + "#s{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2;padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.7);color:#fff;pointer-events:none;white-space:nowrap}"
            + "#o{display:none;position:absolute;left:0;right:0;bottom:0;height:30px;line-height:30px;text-align:center;background:#111;color:#cfd3d8;text-decoration:none}"
            + "body.b #o{display:block}";
        
          return "<!doctype html><html><head><meta charset=\"utf-8\">"
            + '<meta name="viewport" content="width=device-width,initial-scale=1">'
            + '<meta name="robots" content="noindex,nofollow"><title>Video</title>'
            + "<style>" + css + "</style></head><body>"
            + '<div id="v"></div><div id="s"></div>' + bar
            + "<script>(" + clientMain.toString() + ")(" + JSON.stringify(cfg).replace(/</g, "\\u003c") + ");<\/script>"
            + "</body></html>";
        }
        
        function clientKey(req) {
          const cf = String(req.headers["cf-connecting-ip"] || "").trim();
          if (cf) return cf.slice(0, 80);
          const forwarded = String(req.headers["x-forwarded-for"] || "").split(",")[0].trim();
          if (forwarded) return forwarded.slice(0, 80);
          return String(req.socket && req.socket.remoteAddress || "unknown").slice(0, 80);
        }
        
        function allowedByRateLimit(req) {
          const now = Date.now();
          const windowMs = 60 * 1000;
          if (rateBuckets.size > 1000) {
            for (const [bucketKey, bucket] of rateBuckets) {
              if (now - bucket.startedAt >= windowMs * 2) rateBuckets.delete(bucketKey);
            }
          }
          const key = clientKey(req);
          const existing = rateBuckets.get(key);
          if (!existing || now - existing.startedAt >= windowMs) {
            rateBuckets.set(key, { startedAt: now, count: 1 });
            return true;
          }
          existing.count += 1;
          return existing.count <= REQUESTS_PER_MINUTE;
        }
        
        function handle(req, res) {
          res.setHeader("Content-Type", "text/html; charset=utf-8");
          res.setHeader("Content-Security-Policy", "frame-ancestors " + (SITE || "'none'"));
          res.setHeader("X-Content-Type-Options", "nosniff");
          res.setHeader("X-Robots-Tag", "noindex");
          res.setHeader("Cache-Control", "no-store");
        
          try {
            const url = new URL(req.url, "http://x");
        
            if (url.pathname === "/health") {
              res.end(
                "OK v7 secret:" + (SECRET ? "set" : "missing")
                + " secretlen:" + SECRET.length
                + " site:" + (SITE ? "set" : "missing")
                + " retry:" + (RETRY ? "on" : "off")
                + " attempts:" + MAX_ATTEMPTS
                + " rpm:" + REQUESTS_PER_MINUTE,
              );
              return;
            }
        
            if (!allowedByRateLimit(req)) {
              res.statusCode = 429;
              res.setHeader("Retry-After", "60");
              res.end("Too Many Requests");
              return;
            }
        
            const sourceUrl = (url.searchParams.get("url") || "").slice(0, 300);
            const exp = url.searchParams.get("exp") || "";
            const sig = url.searchParams.get("sig") || "";
            const videoMatch = sourceUrl.match(/video\/(\d+)/);
            const expNumber = Number(exp);
            let why = "";
        
            if (!SECRET) why = "no-secret";
            else if (!videoMatch || videoMatch[1].length > 25) why = "bad-url";
            else if (!exp || !Number.isFinite(expNumber)) why = "bad-exp";
            else if (expNumber < Date.now() / 1000) why = "expired";
            else if (!sameSig(sig, sign(videoMatch[1], exp))) why = "bad-sig";
        
            if (why) {
              if (why !== "bad-url") console.log("403", why);
              res.statusCode = 403;
              res.end("Forbidden");
              return;
            }
        
            const userMatch = sourceUrl.match(/@([A-Za-z0-9_.]+)\/video\//);
            res.setHeader("Cache-Control", "public, max-age=300");
            res.end(playerPage(videoMatch[1], userMatch ? userMatch[1] : ""));
          } catch (error) {
            console.error("gateway error", error && error.stack ? error.stack : error);
            res.statusCode = 500;
            res.end("Error");
          }
        }
        
        http.createServer(handle).listen(PORT, "0.0.0.0", function () {
          console.log("gateway v7 listening on " + PORT);
        });
        VIDBEST_LEGACY_V7
        node --check /app/server.cjs
        exec node /app/server.cjs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN}"
    depends_on:
    - app

  rapidapi-tester:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      RAPIDAPI_KEY: "${RAPIDAPI_KEY}"
      TESTER_TOKEN: "${TESTER_TOKEN}"
      TESTER_MAX_MONTHLY: "${TESTER_MAX_MONTHLY:-20}"
      TESTER_TIMEOUT_MS: "15000"
      TESTER_PORT: "8000"
      IBBMM_HOST: "tiktok-download5.p.rapidapi.com"
      IBBMM_PATH: "/getVideo"
      TIKWM_HOST: "tiktok-scraper7.p.rapidapi.com"
      TIKWM_PATH: "/"
      SNAPTIK_HOST: "snaptik-fit.p.rapidapi.com"
      SNAPTIK_PATH: "/tiktok"
    expose:
    - "8000"
    volumes:
    - rapidapi-tester-state:/app/state
    command:
    - /bin/sh
    - -ec
    - |
      mkdir -p /app/state
      cat > /app/tester.js <<'VIDBEST_TESTER_JS'
      "use strict";
      // Vid.Best isolated three-provider API tester.
      // Tests VIDEO METADATA responses only; does not download/copy MP4s or modify R2, KV, D1 or production gateway.
      const http = require("node:http");
      const crypto = require("node:crypto");
      const fs = require("node:fs");

      const PORT = Number(process.env.TESTER_PORT || 8000);
      const API_KEY = process.env.RAPIDAPI_KEY || "";
      const TOKEN = process.env.TESTER_TOKEN || "";
      const STATE_PATH = process.env.TESTER_STATE_PATH || "/app/state/usage.json";
      const MONTHLY_BUDGET = Math.max(1, Math.min(300, Number(process.env.TESTER_MAX_MONTHLY || 20) || 20));
      const TIMEOUT_MS = Math.max(5000, Math.min(30000, Number(process.env.TESTER_TIMEOUT_MS || 15000) || 15000));
      const MIN_GAP_MS = 30000;
      const providers = {
        ibbmm: {
          host: process.env.IBBMM_HOST || "tiktok-download5.p.rapidapi.com",
          path: process.env.IBBMM_PATH || "/getVideo",
          method: "GET", parameter: "url", hdParameter: "hd", hd: "1"
        },
        tikwm: {
          host: process.env.TIKWM_HOST || "tiktok-scraper7.p.rapidapi.com",
          path: process.env.TIKWM_PATH || "/",
          method: "GET", parameter: "url", hdParameter: "hd", hd: "1"
        },
        snaptik: {
          host: process.env.SNAPTIK_HOST || "snaptik-fit.p.rapidapi.com",
          path: process.env.SNAPTIK_PATH || "/tiktok",
          method: "POST", parameter: "url"
        }
      };

      function emptyUsage(month = "") {
        return { month, total: 0, byProvider: {}, lastCall: {}, cooldown: {} };
      }
      function readUsage() {
        try {
          const result = JSON.parse(fs.readFileSync(STATE_PATH, "utf8"));
          return result && typeof result === "object" ? result : emptyUsage();
        } catch { return emptyUsage(); }
      }
      let usage = readUsage();
      function saveUsage() {
        fs.mkdirSync(require("node:path").dirname(STATE_PATH), { recursive: true });
        const tmp = STATE_PATH + ".tmp";
        fs.writeFileSync(tmp, JSON.stringify(usage), { mode: 0o600 });
        fs.renameSync(tmp, STATE_PATH);
      }
      function refreshMonth() {
        const month = new Date().toISOString().slice(0, 7);
        if (usage.month !== month) { usage = emptyUsage(month); saveUsage(); }
      }
      function respond(res, status, payload) {
        res.writeHead(status, { "Content-Type": "application/json; charset=utf-8", "Cache-Control": "no-store", "X-Content-Type-Options": "nosniff" });
        res.end(JSON.stringify(payload));
      }
      function authorized(req) {
        const provided = req.headers["x-test-token"];
        if (!TOKEN || typeof provided !== "string") return false;
        const a = Buffer.from(provided);
        const b = Buffer.from(TOKEN);
        return a.length === b.length && crypto.timingSafeEqual(a, b);
      }
      function validVideo(value) {
        try {
          const uri = new URL(value);
          if (uri.protocol !== "https:" || uri.username || uri.password || uri.port) return null;
          if (uri.hostname.toLowerCase().replace(/^www\./, "") !== "tiktok.com") return null;
          const match = /^\/@([a-zA-Z0-9_.]{1,32})\/video\/(\d{15,25})\/?$$/.exec(uri.pathname);
          if (!match) return null;
          return { url: `https://www.tiktok.com/@$${match[1]}/video/$${match[2]}`, id: match[2] };
        } catch { return null; }
      }
      function validProvider(c) {
        return /^[a-z0-9-]+\.p\.rapidapi\.com$$/.test(c.host) &&
          c.path.startsWith("/") && !c.path.startsWith("//") && !/[?#\\\s]/.test(c.path);
      }
      function looksLikeUrl(v) { return typeof v === "string" && /^https:\/\//.test(v); }
      function summarizeResponse(body, expectedId) {
        const data = body?.data && typeof body.data === "object" ? body.data : body;
        const media = data?.download_link || body?.download_link || {};
        const foundId = data?.id || data?.video_id || body?.video_id || "";
        return {
          response_code: body?.code ?? null,
          response_status: typeof body?.status === "string" ? body.status.slice(0, 40) : null,
          has_video_title: Boolean(data?.title || data?.desc || data?.description),
          has_cover: looksLikeUrl(data?.cover || data?.origin_cover || data?.thumbnail_url),
          has_duration: Number.isFinite(Number(data?.duration)) && Number(data?.duration) > 0,
          has_watermarked_video_link: Boolean(privateWatermarkedMedia(body, expectedId)),
          has_watermarked_hd_link: looksLikeUrl(media?.watermark_hd),
          has_other_video_link: looksLikeUrl(data?.play) || looksLikeUrl(data?.hdplay) || looksLikeUrl(media?.no_watermark),
          video_id_matches: foundId ? String(foundId) === expectedId : null
        };
      }
      // The tester and private cache resolver must agree on both provider response shapes.
      // A matching ID and watermarked URL are required; never substitute unwatermarked links.
      function privateWatermarkedMedia(body, expectedId) {
        const data = body?.data && typeof body.data === "object" ? body.data : body;
        const media = data?.download_link || body?.download_link || {};
        const foundId = data?.id || data?.video_id || body?.video_id || "";
        if (String(foundId) !== String(expectedId)) return null;
        return [data?.wmplay, media?.watermark, media?.watermark_hd].find(looksLikeUrl) || null;
      }
      function failReason(httpStatus, data) {
        if (httpStatus < 200 || httpStatus >= 300) return "http_error";
        if (typeof data !== "object" || !data) return "invalid_json";
        if (typeof data.code === "number" && data.code !== 0) return "provider_error";
        if (typeof data.error === "string" && data.error) return "provider_error";
        return null;
      }
      async function callProvider(name, video, privateMedia = false) {
        const cfg = providers[name];
        if (!validProvider(cfg)) return { provider: name, status: "invalid_provider_config" };
        refreshMonth();
        const now = Date.now();
        if (usage.total >= MONTHLY_BUDGET) return { provider: name, status: "monthly_budget_exhausted" };
        if (now - Number(usage.lastCall[name] || 0) < MIN_GAP_MS) return { provider: name, status: "local_rate_limit", retry_after_seconds: 30 };
        if (now < Number(usage.cooldown[name] || 0)) return { provider: name, status: "provider_cooldown" };
        const requestUrl = new URL(`https://$${cfg.host}$${cfg.path}`);
        const headers = { "x-rapidapi-host": cfg.host, "x-rapidapi-key": API_KEY, "accept": "application/json" };
        let body;
        if (cfg.method === "GET") {
          requestUrl.searchParams.set(cfg.parameter, video.url);
          if (cfg.hdParameter) requestUrl.searchParams.set(cfg.hdParameter, cfg.hd);
        } else {
          headers["content-type"] = "application/json";
          body = JSON.stringify({ [cfg.parameter]: video.url });
        }
        // Reserve the budget BEFORE contacting upstream. Usage persists across container restarts.
        usage.total += 1;
        usage.byProvider[name] = Number(usage.byProvider[name] || 0) + 1;
        usage.lastCall[name] = now;
        saveUsage();
        const start = performance.now();
        try {
          const upstream = await fetch(requestUrl, {
            method: cfg.method, headers, body, redirect: "error", signal: AbortSignal.timeout(TIMEOUT_MS)
          });
          if ([401, 402, 403, 429].includes(upstream.status)) {
            usage.cooldown[name] = Date.now() + 3600000;
            saveUsage();
          }
          const size = Number(upstream.headers.get("content-length") || 0);
          if (size > 100000) { await upstream.body?.cancel(); return { provider: name, status: "response_too_large", http: upstream.status }; }
          const raw = await upstream.text();
          if (raw.length > 100000) return { provider: name, status: "response_too_large", http: upstream.status };
          let data;
          try { data = JSON.parse(raw); } catch { data = null; }
          const problem = failReason(upstream.status, data);
          return {
            provider: name, status: problem || "response_received", http: upstream.status,
            latency_ms: Math.round(performance.now() - start),
            ...(problem ? {} : summarizeResponse(data, video.id)),
            ...(privateMedia && !problem && privateWatermarkedMedia(data, video.id)
              ? { private_watermarked_url: privateWatermarkedMedia(data, video.id) } : {}),
            // Never forward upstream media URLs, original JSON or API key to public compare callers.
            note: "API response only. Does not confirm CDN playback, rights, or a 30-day MP4 cache."
          };
        } catch (error) {
          return { provider: name, status: error?.name === "TimeoutError" ? "timeout" : "network_error",
            latency_ms: Math.round(performance.now() - start) };
        }
      }

      http.createServer(async (req, res) => {
        try {
          const uri = new URL(req.url || "/", "http://localhost");
          if (uri.pathname === "/health") return respond(res, 200, { ok: true, service: "vidbest-three-rapidapi-metadata-tester" });
          if (!authorized(req)) return respond(res, 403, { error: "Invalid testing token" });
          if (uri.pathname === "/config" && req.method === "GET") {
            refreshMonth();
            return respond(res, 200, {
              api_key_configured: Boolean(API_KEY), monthly_budget: MONTHLY_BUDGET, used_this_month: usage.total,
              providers: Object.fromEntries(Object.entries(providers).map(([name, cfg]) => [name,
                { host: cfg.host, path: cfg.path, method: cfg.method, configured: validProvider(cfg) }]))
            });
          }
          // Private app-to-tester endpoint; NOT included in the gateway public reverse proxy.
          // Tested providers share the SAME persistent monthly budget as manual tests.
          if (uri.pathname === "/resolve" && req.method === "POST") {
            if (!API_KEY) return respond(res, 503, { error: "API key not configured" });
            let payload = "";
            for await (const chunk of req) {
              payload += chunk.toString("utf8");
              if (payload.length > 4096) return respond(res, 413, { error: "Body too large" });
            }
            let input;
            try { input = JSON.parse(payload); } catch { return respond(res, 400, { error: "Invalid JSON" }); }
            const video = validVideo(input?.url || "");
            if (!video) return respond(res, 400, { error: "Invalid TikTok URL" });
            for (const name of ["ibbmm", "tikwm"]) {
              const result = await callProvider(name, video, true);
              if (result.status === "response_received" && result.video_id_matches === true &&
                  result.has_watermarked_video_link && result.private_watermarked_url) {
                return respond(res, 200, { id: video.id, provider: name, media_url: result.private_watermarked_url });
              }
            }
            return respond(res, 404, { id: video.id, error: "No watermarked media from allowed providers" });
          }
          if (uri.pathname === "/compare" && req.method === "GET") {
            if (!API_KEY) return respond(res, 503, { error: "RAPIDAPI_KEY not configured" });
            const video = validVideo(uri.searchParams.get("url") || "");
            if (!video) return respond(res, 400, { error: "Provide a full HTTPS TikTok URL like https://www.tiktok.com/@creator/video/123..." });
            const selected = uri.searchParams.get("provider") || "all";
            const names = selected === "all" ? Object.keys(providers) : [selected];
            if (names.some(name => !providers[name])) return respond(res, 400, { error: "Provider must be ibbmm, tikwm, snaptik, or all." });
            const results = [];
            for (const name of names) results.push(await callProvider(name, video));
            return respond(res, 200, { video_id: video.id, results, used_this_month: usage.total, monthly_budget: MONTHLY_BUDGET });
          }
          return respond(res, 404, { error: "Not found" });
        } catch (err) {
          console.error("tester-handler-error", err?.message || "unknown");
          return respond(res, 500, { error: "Internal tester error" });
        }
      }).listen(PORT, "0.0.0.0", () => {
        console.log(`Vid.Best RapidAPI metadata tester ready on :$${PORT}. Production gateway unchanged.`);
      });
      VIDBEST_TESTER_JS
      node --check /app/tester.js
      exec node /app/tester.js
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gateway-state:
  rapidapi-tester-state:
