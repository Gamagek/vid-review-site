              bucket: BUCKET,
              endpointConfigured: Boolean(ENDPOINT),
              accessKeyConfigured: Boolean(ACCESS_KEY),
              secretKeyConfigured: Boolean(SECRET_KEY),
              signSecretConfigured: Boolean(SECRET),
              activeJobs: jobPromises.size,
              r2HeadTimeoutMs: R2_HEAD_TIMEOUT_MS,
              authorizedMirrorConfigured: Boolean(MIRROR_BASE),
              rapidApiCacheEnabled: RAPIDAPI_ENABLED,
              rapidApiCurrentAuthorizedGrants: [...authorizedGrants.values()].filter(until => until > Date.now()).length,
              adminCacheWebhookConfigured: Boolean(CACHE_HOOK_SECRET),
              providerCooldownUntil: globalCooldown() ? new Date(globalCooldown().until).toISOString() : null,
              jobs: debugJobs(),
