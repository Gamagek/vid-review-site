            }
            const timestamp = String(req.headers["x-vidbest-cache-timestamp"] || "");
            const nonce = String(req.headers["x-vidbest-cache-nonce"] || "");
            const signature = String(req.headers["x-vidbest-cache-signature"] || "");
            if (!/^\d{10}$/.test(timestamp) || !/^[a-f0-9-]{36}$/.test(nonce) ||
