# OPTIONAL v7 signed player added to original v56 (unchanged /status, /stream, /watch, cache webhooks).
# Replace the EXISTING video-site stack only after backing it up. Do NOT deploy a second cloudflared tunnel.
# For full setup and rollback guidance see ops/portainer/README-optional-v7.md.
# Vid.Best v56 — admin-confirmed automatic TikTok cache + manual retry + manual R2 upload.
# RapidAPI cache requests require a signed Worker webhook for a rights-certified, specific video ID.
# Saiyaara (7669587518156705056) and Summer (7332342275151760642) excluded from new fallback.
# Keep the old v53 YAML for an easy rollback; backup your Portainer stack before updating.
# Update the EXISTING video-site Portainer stack, not a second copy of the same tunnel.
# Existing Cloudflare tunnel public hostname MUST route video.megasale.win -> http://app:8080.
# Existing gateway R2, SIGN_SECRET and tunnel variables are needed to RESTORE the removed services.
# RapidAPI Tester still does not store MP4s. On certified IDs only, app may call private /resolve and upload the watermarked MP4 to R2.
# All testing + cache-resolution requests share TESTER_MAX_MONTHLY and tester-state usage.json.
# Uses shell heredocs instead of Compose configs.content (better Portainer compatibility).
services:
  app:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_VERSION: "56-R2-ADMIN-APPROVED-RAPIDAPI-CACHE"
      PORT: "8080"
      R2_ENDPOINT: "https://de9e41200f6bdfab80553c8eb08f9b16.r2.cloudflarestorage.com"
      R2_BUCKET_NAME: "vid-assets"
      R2_ACCESS_KEY: "${R2_ACCESS_KEY}"
      R2_SECRET_KEY: "${R2_SECRET_KEY}"
      SIGN_SECRET: "${SIGN_SECRET}"
      AUTHORIZED_MP4_BASE_URL: "${AUTHORIZED_MP4_BASE_URL:-}"
      # Only signed per-video admin webhook grants may use RapidAPI; protected Summer/Saiyaara never changed.
      RAPIDAPI_CACHE_ENABLED: "${RAPIDAPI_CACHE_ENABLED:-true}"
      TESTER_TOKEN: "${TESTER_TOKEN}"
      R2_HEAD_TIMEOUT_MS: "4000"
      DOWNLOAD_TIMEOUT_MS: "120000"
      MAX_AUTHORIZED_MP4_BYTES: "104857600"
      CACHE_HOOK_SECRET: "${CACHE_HOOK_SECRET}"
    expose:
    - "8080"
    volumes:
    - gateway-state:/app/state
    depends_on:
    - rapidapi-tester
    command:
    - /bin/sh
    - -ec
    - |
      cat > /app/server.js <<'VIDBEST_GATEWAY_JS'
      const http = require("http");
      const crypto = require("crypto");
      const fs = require("fs");
      const { spawn } = require("child_process");
      const { Readable, Transform } = require("stream");
      const { pipeline } = require("stream/promises");
      const {
        S3Client,
        HeadObjectCommand,
        GetObjectCommand,
        PutObjectCommand,
        DeleteObjectCommand
      } = require("@aws-sdk/client-s3");

      const PORT = Number(process.env.PORT || 8080);
      const VERSION = String(process.env.APP_VERSION || "56-R2-ADMIN-APPROVED-RAPIDAPI-CACHE");
      const SECRET = String(process.env.SIGN_SECRET || "");
      const BUCKET = String(process.env.R2_BUCKET_NAME || "vid-assets");
      const ENDPOINT = String(process.env.R2_ENDPOINT || "");
      const ACCESS_KEY = String(process.env.R2_ACCESS_KEY || "");
      const SECRET_KEY = String(process.env.R2_SECRET_KEY || "");
      const MIRROR_BASE = String(process.env.AUTHORIZED_MP4_BASE_URL || "").trim();
      const RAPIDAPI_ENABLED = String(process.env.RAPIDAPI_CACHE_ENABLED || "false").toLowerCase() === "true";
      const PRIVATE_RESOLVER_TOKEN = String(process.env.TESTER_TOKEN || "");
      // No static video allowlist: Admin Panel authorizes one specific ID at a time via signed, short-lived webhook.
      const CACHE_HOOK_SECRET = String(process.env.CACHE_HOOK_SECRET || "");
      const PROTECTED_VIDEO_IDS = new Set(["7332342275151760642", "7669587518156705056"]);
      const authorizedGrants = new Map();
      const usedHookNonces = new Map();
      function mayUseRapidAPIForCache(id) {
        return RAPIDAPI_ENABLED && Boolean(PRIVATE_RESOLVER_TOKEN) &&
          !PROTECTED_VIDEO_IDS.has(String(id)) && Number(authorizedGrants.get(String(id)) || 0) > Date.now();
      }
      const MAX_AUTHORIZED_MP4_BYTES = Math.max(32768, Math.min(104857600, Number(process.env.MAX_AUTHORIZED_MP4_BYTES || 104857600)));
      const STATE_FILE = "/app/state/tiktok-circuit.json";

      const CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000;
      const CACHE_CONTROL = "public, max-age=2592000, immutable";
      const STREAM_CACHE_CONTROL = "private, no-store";
      const R2_HEAD_TIMEOUT_MS = Math.min(8000, Math.max(1500, Number(process.env.R2_HEAD_TIMEOUT_MS || 4000)));
      const DOWNLOAD_TIMEOUT_MS = Math.min(180000, Math.max(30000, Number(process.env.DOWNLOAD_TIMEOUT_MS || 120000)));
      const COOLDOWN_429_MS = 6 * 60 * 60 * 1000;
      const COOLDOWN_403_MS = 24 * 60 * 60 * 1000;
      const COOLDOWN_OTHER_MS = 30 * 60 * 1000;

      const jobs = new Map();
      const jobPromises = new Map();
      const cooldowns = new Map();
      let queueTail = Promise.resolve();
      let lastStatus = "Gateway started.";
      let globalCooldownState = { until: 0, kind: "", reason: "" };
      try {
        const parsed = JSON.parse(fs.readFileSync(STATE_FILE, "utf8"));
        if (Number.isFinite(parsed.until) && parsed.until > Date.now()) globalCooldownState = parsed;
      } catch {}

      function globalCooldown() {
        return globalCooldownState.until > Date.now() ? globalCooldownState : null;
      }
      function setGlobalCooldown(kind) {
        const ms = kind === "429" ? COOLDOWN_429_MS : kind === "403" ? COOLDOWN_403_MS :
          kind === "restricted" ? 60 * 60 * 1000 : 0;
        if (!ms) return;
        const until = Date.now() + ms;
        if (until <= globalCooldownState.until) return;
        globalCooldownState = { until, kind, reason: "TikTok access was refused or failed upstream." };
        try {
          fs.mkdirSync("/app/state", { recursive: true });
          const temporary = STATE_FILE + ".tmp";
          fs.writeFileSync(temporary, JSON.stringify(globalCooldownState), { mode: 0o600 });
          fs.renameSync(temporary, STATE_FILE);
        } catch (error) { console.warn("[provider-cooldown-persistence]", error.message); }
        console.warn("[provider-cooldown]", kind, new Date(until).toISOString());
      }

      const s3 = new S3Client({
        region: "auto",
        endpoint: ENDPOINT,
        forcePathStyle: true,
        credentials: {
          accessKeyId: ACCESS_KEY,
          secretAccessKey: SECRET_KEY
        }
      });

      function cors(extra) {
        return Object.assign({
          "Access-Control-Allow-Origin": "*",
          "Access-Control-Allow-Methods": "GET, HEAD, OPTIONS",
          "Access-Control-Allow-Headers": "Range, Content-Type",
          "Cross-Origin-Resource-Policy": "cross-origin"
        }, extra || {});
      }

      function json(res, code, body, extra) {
        res.writeHead(code, cors(Object.assign({
          "Content-Type": "application/json; charset=utf-8",
          "Cache-Control": "no-store"
        }, extra || {})));
        res.end(JSON.stringify(body));
      }

      function text(res, code, body, extra) {
        res.writeHead(code, cors(Object.assign({
          "Content-Type": "text/plain; charset=utf-8",
          "Cache-Control": "no-store"
        }, extra || {})));
        res.end(String(body));
      }

      function sign(id, exp) {
        return crypto
          .createHmac("sha256", SECRET)
          .update(String(id) + "." + String(exp))
          .digest("hex");
      }

      function safeEqual(a, b) {
        const x = Buffer.from(String(a));
        const y = Buffer.from(String(b));
        if (x.length !== y.length) return false;
        return crypto.timingSafeEqual(x, y);
      }

      function validSignature(id, exp, sig) {
        if (!SECRET) return false;
        if (!/^\d{15,25}$/.test(String(id || ""))) return false;
        if (!/^\d+$/.test(String(exp || ""))) return false;
        const expires = Number(exp);
        if (!Number.isFinite(expires)) return false;
        if (expires < Math.floor(Date.now() / 1000)) return false;
        return safeEqual(String(sig || ""), sign(id, exp));
      }

      function validateTikTokSource(id, value) {
        try {
          const url = new URL(String(value || ""));
          const host = url.hostname.toLowerCase().replace(/^www\./, "");
          if (url.protocol !== "https:") return null;
          if (host !== "tiktok.com" || url.username || url.password || url.port) return null;
          const match = url.pathname.match(/^\/@([A-Za-z0-9_.]{1,32})\/video\/(\d{15,25})\/?$/);
          if (!match) return null;
          if (match[2] !== String(id)) return null;
          url.search = "";
          url.hash = "";
          return url.toString();
        } catch {
          return null;
        }
      }

      function cacheKeys(id) {
        return [
          String(id) + ".mp4",
          "uploads/tiktok/" + String(id) + ".mp4",
          "uploads/" + String(id) + ".mp4"
        ];
      }

      function isR2NotFound(error) {
        return Number(error?.$$metadata?.httpStatusCode || 0) === 404 ||
          ["NotFound", "NoSuchKey", "NoSuchObject"].includes(String(error?.name || ""));
      }

      async function headCached(key) {
        try {
          return await s3.send(new HeadObjectCommand({ Bucket: BUCKET, Key: key }), {
            abortSignal: AbortSignal.timeout(R2_HEAD_TIMEOUT_MS)
          });
        } catch (error) {
          if (isR2NotFound(error)) return null;
          throw error;
        }
      }

      // Check the three supported keys CONCURRENTLY. Previously three serial
      // R2 HEAD calls could exceed the Worker 10s /status timeout on a miss.
      async function findCachedVideo(id) {
        const keys = cacheKeys(id);
        const results = await Promise.allSettled(keys.map(headCached));
        let firstError = null;
        for (let i = 0; i < keys.length; i++) {
          const item = results[i];
          if (item.status === "rejected") {
            if (!firstError) firstError = item.reason;
            continue;
          }
          const head = item.value;
          if (!head || !Number(head.ContentLength || 0)) continue;
          const modified = head.LastModified ? new Date(head.LastModified).getTime() : Date.now();
          const ageMs = Math.max(0, Date.now() - modified);
          if (ageMs > CACHE_TTL_MS) {
            lastStatus = "Expired cache object: " + keys[i];
            // Never silently delete user-uploaded or legacy R2 files here.
            // Expired files are simply excluded from playback.
            continue;
          }
          return {
            key: keys[i],
            size: Number(head.ContentLength || 0),
            ageMs,
            lastModified: head.LastModified ? new Date(head.LastModified).toISOString() : null
          };
        }
        if (firstError) {
          const name = String(firstError?.name || "R2Error");
          const status = Number(firstError?.$$metadata?.httpStatusCode || 0);
          throw new Error("R2 HEAD failed (" + name + ", HTTP " + status + ")");
        }
        return null;
      }

      function enqueue(task) {
        const next = queueTail.then(task, task);
        queueTail = next.catch(() => {});
        return next;
      }

      function setCooldown(id, kind, message) {
        let delay = COOLDOWN_OTHER_MS;
        if (kind === "429") delay = COOLDOWN_429_MS;
        if (kind === "403") delay = COOLDOWN_403_MS;
        const until = Date.now() + delay;
        cooldowns.set(String(id), { until, kind, message: String(message || "Source unavailable") });
        jobs.set(String(id), {
          status: "cooldown",
          cooldownUntil: new Date(until).toISOString(),
          error: String(message || "Source unavailable")
        });
      }

      function getCooldown(id) {
        const current = cooldowns.get(String(id));
        if (!current) return null;
        if (Date.now() >= current.until) {
          cooldowns.delete(String(id));
          return null;
        }
        return current;
      }

      function runProcess(command, args, timeoutMs = DOWNLOAD_TIMEOUT_MS) {
        return new Promise((resolve) => {
          const child = spawn(command, args, { stdio: ["ignore", "ignore", "pipe"] });
          let stderr = "";
          let finished = false;
          const settle = result => {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            resolve(result);
          };
          const timer = setTimeout(() => {
            child.kill("SIGKILL");
            settle({ ok: false, code: -2, stderr: "Extraction process timed out." });
          }, timeoutMs);
          timer.unref();
          child.stderr.on("data", chunk => {
            stderr += chunk.toString();
            if (stderr.length > 12000) stderr = stderr.slice(-12000);
          });
          child.on("error", error => settle({ ok: false, code: -1, stderr: error.message }));
          child.on("close", code => settle({ ok: code === 0, code: Number(code), stderr: stderr.trim() }));
        });
      }

      async function validateMp4(filepath) {
        if (!fs.existsSync(filepath)) return false;
        const stat = fs.statSync(filepath);
        if (!stat.isFile() || stat.size < 32768) return false;

        const result = await runProcess("ffprobe", [
          "-v", "error",
          "-select_streams", "v:0",
          "-show_entries", "stream=codec_type",
          "-of", "default=noprint_wrappers=1:nokey=1",
          filepath
        ]);

        return result.ok;
      }

      async function downloadOneJob(id, sourceUrl, filepath) {
        const args = [
          "--no-playlist",
          "--no-warnings",
          "--no-progress",
          "--retries", "0",
          "--fragment-retries", "0",
          "--extractor-retries", "0",
          "--concurrent-fragments", "1",
          "--socket-timeout", "25",
          "-f", "best[ext=mp4]/best",
          "--merge-output-format", "mp4",
          "-o", filepath,
          sourceUrl
        ];

        lastStatus = "Starting one yt-dlp extraction job for " + id;
        return runProcess("/usr/local/bin/yt-dlp", args);
      }

      // Optional BACKUP: a trusted HTTPS origin operated by the Vid.Best owner
      // can serve licensed MP4 files as <video-id>.mp4. This source is never
      // derived from an arbitrary viewer URL and redirects are disallowed.
      async function tryAuthorizedMirror(id, filepath) {
        if (!MIRROR_BASE) return false;
        let target;
        try {
          const base = new URL(MIRROR_BASE);
          if (base.protocol !== "https:" || base.username || base.password || base.search || base.hash || base.port) {
            console.warn("[authorized-mirror] Invalid configured base URL");
            return false;
          }
          if (!base.pathname.endsWith("/")) base.pathname += "/";
          target = new URL(encodeURIComponent(id) + ".mp4", base);
          if (target.origin !== base.origin || !target.pathname.startsWith(base.pathname)) return false;
        } catch { return false; }
        try {
          const response = await fetch(target.href, {
            redirect: "error",
            headers: { "Accept": "video/mp4" },
            signal: AbortSignal.timeout(25000)
          });
          if (!response.ok || !response.body) return false;
          const contentType = (response.headers.get("content-type") || "").toLowerCase().split(";")[0].trim();
          if (!["video/mp4", "application/octet-stream"].includes(contentType)) {
            await response.body.cancel(); return false;
          }
          const sizeHeader = Number(response.headers.get("content-length") || 0);
          if (sizeHeader > MAX_AUTHORIZED_MP4_BYTES) { await response.body.cancel(); return false; }
          let transferred = 0;
          const guard = new Transform({ transform(chunk, encoding, cb) {
            transferred += chunk.length;
            cb(transferred <= MAX_AUTHORIZED_MP4_BYTES ? null : new Error("Authorized MP4 too large"), chunk);
          } });
          await pipeline(Readable.fromWeb(response.body), guard, fs.createWriteStream(filepath, { flags: "wx" }));
          if (transferred < 32768) return false;
          const valid = await validateMp4(filepath);
          if (valid) console.info("[authorized-mirror-ready]", id, transferred);
          return valid;
        } catch (error) {
          console.warn("[authorized-mirror-miss]", id, String(error?.message || error).slice(0,160));
          return false;
        } finally {
          // Caller removes unvalidated and partial data before primary extraction.
        }
      }

      // Browser users cannot access /resolve: public app reverse-proxies only GET /tester/config and /tester/compare.
      // Tester keeps the API key and accounts for cache requests in its 20/month budget.
      async function resolveWatermarkedVideoInternally(sourceUrl) {
        if (!PRIVATE_RESOLVER_TOKEN) return null;
        const payload = JSON.stringify({ url: sourceUrl });
        return new Promise((resolve) => {
          const request = http.request({
            hostname: "rapidapi-tester", port: 8000, path: "/resolve", method: "POST", timeout: 39000,
            headers: { "x-test-token": PRIVATE_RESOLVER_TOKEN, "content-type": "application/json",
              "content-length": Buffer.byteLength(payload) }
          }, (response) => {
            let answer = "";
            response.on("data", (chunk) => {
              answer += chunk.toString("utf8");
              if (answer.length > 8192) response.destroy();
            });
            response.on("end", () => {
              if (response.statusCode !== 200) { resolve(null); return; }
              try { resolve(JSON.parse(answer)); } catch { resolve(null); }
            });
          });
          request.once("timeout", () => request.destroy(new Error("resolver_timeout")));
          request.once("error", () => resolve(null));
          request.end(payload);
        });
      }

      // Accept only TikTok video CDN origins; no arbitrary API-supplied internal/third-party URL fetching.
      function validatedMediaCdnUrl(raw) {
        try {
          const u = new URL(String(raw || ""));
          const h = u.hostname.toLowerCase().replace(/\.$/, "");
          const allowed = ["akamaized.net", "tiktokcdn.com", "tiktokcdn-us.com", "tiktokv.com"];
          if (u.protocol !== "https:" || u.username || u.password || u.port ||
              !allowed.some(suffix => h !== suffix && h.endsWith("." + suffix))) return null;
          return u;
        } catch { return null; }
      }

      async function fetchAllowedCdnMp4(mediaUrl) {
        let current = String(mediaUrl);
        for (let hops = 0; hops < 3; hops++) {
          if (!validatedMediaCdnUrl(current)) throw new Error("RapidAPI returned a nonapproved CDN host");
          const response = await fetch(current, {
            method: "GET", redirect: "manual",
            headers: { Accept: "video/mp4,application/octet-stream" },
            signal: AbortSignal.timeout(30000)
          });
          if ([301, 302, 303, 307, 308].includes(response.status)) {
            const destination = response.headers.get("location");
            if (!destination) throw new Error("Missing CDN redirect location");
            current = new URL(destination, current).toString();
            await response.body?.cancel();
            continue;
          }
          if (!response.ok || !response.body) throw new Error("Watermarked CDN media unavailable (HTTP " + response.status + ")");
          const type = String(response.headers.get("content-type") || "").toLowerCase().split(";")[0].trim();
          if (!["video/mp4", "application/octet-stream"].includes(type)) {
            await response.body.cancel(); throw new Error("CDN response was not MP4");
          }
          const lenText = response.headers.get("content-length");
          if (lenText && Number(lenText) > MAX_AUTHORIZED_MP4_BYTES) {
            await response.body.cancel(); throw new Error("Watermarked MP4 is over size limit");
          }
          return response;
        }
        throw new Error("Excessive CDN redirect chain");
      }

      async function tryRapidApiForCertifiedVideo(id, sourceUrl, filepath) {
        if (!mayUseRapidAPIForCache(id)) return false;
        try {
          jobs.set(String(id), { status: "preparing", provider: "rapidapi" });
          const resolved = await resolveWatermarkedVideoInternally(sourceUrl);
          if (!resolved || resolved.id !== String(id) || !validatedMediaCdnUrl(resolved.media_url)) {
            console.warn("[rapidapi-cache] No validated watermarked CDN URL for", id);
            return false;
          }
          const response = await fetchAllowedCdnMp4(resolved.media_url);
          let bytes = 0;
          const guard = new Transform({ transform(chunk, encoding, cb) {
            bytes += chunk.length;
            cb(bytes <= MAX_AUTHORIZED_MP4_BYTES ? null : new Error("Watermarked MP4 exceeds size limit"), chunk);
          } });
          await pipeline(Readable.fromWeb(response.body), guard, fs.createWriteStream(filepath, { flags: "wx" }));
          if (bytes < 32768) throw new Error("Watermarked MP4 too small");
          const fd = fs.openSync(filepath, "r");
          const probe = Buffer.alloc(12);
          try { fs.readSync(fd, probe, 0, 12, 0); } finally { fs.closeSync(fd); }
          if (probe.toString("ascii", 4, 8) !== "ftyp") throw new Error("Invalid MP4 header");
          if (!await validateMp4(filepath)) throw new Error("Watermarked MP4 failed ffprobe validation");
          console.info("[rapidapi-cache-ready]", id, resolved.provider, bytes);
          return true;
        } catch (error) {
          console.warn("[rapidapi-cache-failed]", id, String(error?.message || error).slice(0,150));
          try { if (fs.existsSync(filepath)) fs.unlinkSync(filepath); } catch {}
          return false;
        }
      }

      function classifyFailure(stderr) {
        const value = String(stderr || "").toLowerCase();
        if (value.includes("429") || value.includes("too many requests")) return "429";
        if (value.includes("403") || value.includes("forbidden") || value.includes("access denied")) return "403";
        if (value.includes("unexpected response from webpage request")) return "restricted";
        return "other";
      }

      async function performCacheJob(id, originalUrl) {
        const sourceUrl = validateTikTokSource(id, originalUrl);
        if (!sourceUrl) {
          jobs.set(String(id), { status: "error", error: "Invalid TikTok source URL." });
          lastStatus = "Invalid TikTok source URL for " + id;
          return false;
        }

        const cached = await findCachedVideo(id);
        if (cached) {
          jobs.set(String(id), { status: "cached", key: cached.key, size: cached.size });
          lastStatus = "R2 cache hit: " + cached.key;
          return true;
        }

        const cooldown = getCooldown(id);
        const providerBlock = globalCooldown();
        const filepath = "/tmp/" + String(id) + ".mp4";
        const objectKey = "uploads/tiktok/" + String(id) + ".mp4";

        try { if (fs.existsSync(filepath)) fs.unlinkSync(filepath); } catch {}

        // Prefer the owner's licensed HTTPS media mirror when configured.
        // This saves upstream TikTok requests, works during a provider cooldown,
        // and does not proxy blocked TikTok pages or require a headless browser.
        jobs.set(String(id), { status: "preparing", startedAt: new Date().toISOString() });
        let preparedBy = "authorized-mirror";
        let mirrorReady = await tryAuthorizedMirror(id, filepath);
        if (!mirrorReady) {
          try { if (fs.existsSync(filepath)) fs.unlinkSync(filepath); } catch {}
          // R2-first and owner-mirror-first remain unchanged. Only explicitly certified IDs
          // may use RapidAPI; it runs before the old yt-dlp global cooldown check.
          const rapidApiReady = await tryRapidApiForCertifiedVideo(id, sourceUrl, filepath);
          if (rapidApiReady) {
            preparedBy = "rapidapi-watermarked";
          } else {
          const activeBlock = providerBlock || globalCooldown();
          if (activeBlock || cooldown) {
            const until = activeBlock?.until || cooldown.until;
            const message = activeBlock ? "Provider access temporarily paused after upstream block." : cooldown.message;
            jobs.set(String(id), { status: "cooldown", cooldownUntil: new Date(until).toISOString(), error: message });
            lastStatus = "Cooldown active for " + id;
            return false;
          }
          preparedBy = "yt-dlp";
          jobs.set(String(id), { status: "scraping", startedAt: new Date().toISOString() });
          lastStatus = "Attempting public source extraction for " + id;
          const result = await downloadOneJob(id, sourceUrl, filepath);
          if (!result.ok) {
            const kind = classifyFailure(result.stderr);
            const message = "yt-dlp failed with code " + String(result.code) + (result.stderr ? ": " + result.stderr.slice(-1000) : "");
            console.warn("[extraction-failed]", id, "kind=" + kind, String(result.stderr || "").slice(-500));
            setCooldown(id, kind, message);
            setGlobalCooldown(kind);
            lastStatus = message;
            try { if (fs.existsSync(filepath)) fs.unlinkSync(filepath); } catch {}
            return false;
          }
          if (!await validateMp4(filepath)) {
            const message = "Downloaded file failed MP4 validation.";
            setCooldown(id, "other", message);
            lastStatus = message;
            try { if (fs.existsSync(filepath)) fs.unlinkSync(filepath); } catch {}
            return false;
          }
          } // End legacy cooldown/yt-dlp path when RapidAPI did not prepare the file.
        }

        const stat = fs.statSync(filepath);
        jobs.set(String(id), { status: "uploading", size: stat.size });
        lastStatus = "Uploading " + id + " to R2 as " + objectKey + " (" + stat.size + " bytes).";

        await s3.send(new PutObjectCommand({
          Bucket: BUCKET,
          Key: objectKey,
          Body: fs.createReadStream(filepath),
          ContentLength: stat.size,
          ContentType: "video/mp4",
          CacheControl: CACHE_CONTROL,
          Metadata: {
            source: "vidbest-tiktok-gateway",
            video_id: String(id),
            gateway_version: VERSION,
            media_origin: preparedBy
          }
        }));

        const uploaded = await findCachedVideo(id);
        if (!uploaded) throw new Error("R2 upload completed but verification failed.");
        console.info("[cache-ready]", id, uploaded.key, uploaded.size);

        cooldowns.delete(String(id));
        jobs.set(String(id), { status: "cached", key: uploaded.key, size: uploaded.size });
        lastStatus = "R2 cache ready: " + uploaded.key;
        return true;
      }

      function startCacheJob(id, originalUrl) {
        const key = String(id);
        if (jobPromises.has(key)) return jobPromises.get(key);

        const promise = enqueue(async () => {
          try {
            return await performCacheJob(key, originalUrl);
          } catch (error) {
            const message = "Cache job error: " + String(error && error.message ? error.message : error);
            jobs.set(key, { status: "error", error: message });
            lastStatus = message;
            return false;
          } finally {
            jobPromises.delete(key);
            const filepath = "/tmp/" + key + ".mp4";
            try { if (fs.existsSync(filepath)) fs.unlinkSync(filepath); } catch {}
          }
        });

        jobPromises.set(key, promise);
        return promise;
      }

      async function streamVideo(req, res, objectInfo) {
        try {
          const params = { Bucket: BUCKET, Key: objectInfo.key };
          if (req.headers.range) params.Range = req.headers.range;

          const data = await s3.send(new GetObjectCommand(params));
          const headers = cors({
            "Content-Type": data.ContentType || "video/mp4",
            "Accept-Ranges": "bytes",
            "Cache-Control": STREAM_CACHE_CONTROL,
          "X-Content-Type-Options": "nosniff"
          });

          if (data.ContentLength !== undefined) headers["Content-Length"] = String(data.ContentLength);
          if (data.ContentRange) headers["Content-Range"] = String(data.ContentRange);

          res.writeHead(data.ContentRange ? 206 : 200, headers);

          if (req.method === "HEAD") {
            res.end();
            return;
          }

          if (data.Body && typeof data.Body.pipe === "function") {
            data.Body.pipe(res);
          } else {
            res.end();
          }
        } catch (error) {
          lastStatus = "Stream error: " + String(error && error.message ? error.message : error);
          if (!res.headersSent) text(res, 404, "Video stream error");
          else res.end();
        }
      }

      function debugJobs() {
        const output = {};
        for (const entry of jobs.entries()) output[entry[0]] = entry[1];
        return output;
      }

      async function handle(req, res) {
        try {
          const url = new URL(req.url || "/", "http://" + (req.headers.host || "localhost"));

          // Optional historical v7 player; fixed internal host and signed TikTok URL only.
          // Does not initiate caching, change current /watch, or expose a second tunnel.
          if (url.pathname === "/legacy/watch") {
            if (req.method !== "GET") { text(res, 405, "Method Not Allowed"); return; }
            if (url.search.length > 2048) { text(res, 414, "URL Too Long"); return; }
            let validSource = false;
            try {
              const source = new URL(url.searchParams.get("url") || "");
              validSource = source.protocol === "https:" &&
                source.hostname === "www.tiktok.com" && !source.username && !source.password &&
                /^\\/@[A-Za-z0-9_.]{1,32}\\/video\\/\\d{15,25}\\/?$/.test(source.pathname) &&
                /^\\d+$/.test(url.searchParams.get("exp") || "") &&
                /^[a-f0-9]{64}$/i.test(url.searchParams.get("sig") || "");
            } catch {}
            if (!validSource) { text(res, 400, "Invalid signed TikTok URL"); return; }
