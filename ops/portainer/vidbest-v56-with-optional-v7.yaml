            if (!/^\d{15,25}$/.test(videoId) || PROTECTED_VIDEO_IDS.has(videoId) ||
                !validateTikTokSource(videoId, videoUrl)) {
              json(res, 400, { status: "invalid_video" }); return;
            }
            const message = timestamp + "\n" + nonce + "\n" + videoId + "\n" + videoUrl;
            const expected = crypto.createHmac("sha256", CACHE_HOOK_SECRET).update(message).digest("hex");
            if (!safeEqual(signature, expected)) { json(res, 403, { status: "forbidden" }); return; }
            const now = Date.now();
            for (const [n, until] of usedHookNonces) if (until <= now) usedHookNonces.delete(n);
            if (usedHookNonces.has(nonce)) { json(res, 409, { status: "replayed" }); return; }
            usedHookNonces.set(nonce, now + 360000);
