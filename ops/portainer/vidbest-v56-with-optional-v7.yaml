            if (req.method !== "GET") { text(res, 405, "Method Not Allowed"); return; }
            if (url.search.length > 4096) { text(res, 414, "URL Too Long"); return; }
            const target = "http://rapidapi-tester:8000" + url.pathname.slice("/tester".length) + url.search;
            const headers = {};
            if (typeof req.headers["x-test-token"] === "string") headers["x-test-token"] = req.headers["x-test-token"];
            const proxy = http.get(target, { headers, timeout: 65000 }, (upstream) => {
