              "const streamUrl=" + JSON.stringify(streamUrl) + ";const statusUrl=" + JSON.stringify(statusUrl) + ";let attempts=0;const maxAttempts=15;" +
              "async function poll(){try{const r=await fetch(statusUrl,{cache:'no-store'});const d=await r.json();" +
