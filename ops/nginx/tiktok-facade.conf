# Vid.Best TikTok facade: fixed-target oEmbed cache only.
#
# Put proxy_cache_path inside the nginx http{} context.
# Keep this server reachable from the Cloudflare Tunnel/local proxy network only.

proxy_cache_path /var/cache/nginx/vidbest-tiktok levels=1:2 keys_zone=vidbest_tiktok:10m max_size=100m inactive=24h use_temp_path=off;

server {
    listen 127.0.0.1:8788;
    server_name _;

    location = /api/tiktok-oembed {
        limit_except GET HEAD {
            deny all;
        }

        proxy_ssl_server_name on;
        proxy_ssl_name www.tiktok.com;
        proxy_set_header Host www.tiktok.com;
        proxy_set_header Accept "application/json";
        proxy_set_header User-Agent "VidBest-TikTok-Facade/1.0";

        # Fixed upstream: this is NOT an open proxy.
        proxy_pass https://www.tiktok.com/oembed;

        proxy_cache vidbest_tiktok;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 24h;
        proxy_cache_valid 400 1m;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        proxy_hide_header Set-Cookie;
        add_header X-VidBest-TikTok-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
    }
}
