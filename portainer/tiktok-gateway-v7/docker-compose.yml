services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidbest-tiktok-gateway-v7
    environment:
      PORT: "8080"
      APP_VERSION: "7"
      ALLOWED_SITE: ${ALLOWED_SITE}
      SIGN_SECRET: ${SIGN_SECRET}
      AUTO_RETRY: "1"
      PLAYER_ATTEMPTS: "2"
      PLAYER_WAIT_MS: "15000"
      RETRY_BASE_MS: "4500"
      RETRY_JITTER_MS: "1200"
      FALLBACK_REVEAL_MS: "5000"
      REQUESTS_PER_MINUTE: "30"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 192m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vidbest-tiktok-cloudflared-v7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
