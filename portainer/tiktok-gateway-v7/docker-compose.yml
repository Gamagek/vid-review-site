services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidbest-tiktok-gateway-v7
    environment:
      PORT: "8080"
      APP_VERSION: "7"
      ALLOWED_SITE: ${ALLOWED_SITE}
      SIGN_SECRET: ${SIGN_SECRET}
      AUTO_RETRY: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 192m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vidbest-tiktok-cloudflared-v7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
