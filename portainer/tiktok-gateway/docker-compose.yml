services:
  tiktok-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidbest-tiktok-gateway
    restart: unless-stopped
    environment:
      PORT: "8787"
      TIKTOK_GATEWAY_TOKEN: ${TIKTOK_GATEWAY_TOKEN}
      ALLOWED_ORIGIN: "https://vid.best"
      FETCH_TIMEOUT_MS: "8000"
    ports:
      - "8787:8787"
    mem_limit: 256m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s