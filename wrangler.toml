name = "vid-best"
main = "src/index.js"
compatibility_date = "2024-08-05"
type = "javascript"

[[d1_databases]]
binding = "DB"
database_name = "video-reviews-db"
database_id = "YOUR_D1_ID"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vid-assets"

[env.production]
name = "vid-best-prod"
route = "vidbest.com/*"
zone_id = "YOUR_ZONE_ID"

[env.production.d1_databases]
binding = "DB"
database_name = "video-reviews-db"
database_id = "YOUR_D1_ID"

[env.production.r2_buckets]
binding = "BUCKET"
bucket_name = "vid-assets"

[vars]
ENVIRONMENT = "production"
API_RATE_LIMIT = "1000"
