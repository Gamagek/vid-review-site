name = "vid-review-site"
main = "src/edge.js"
compatibility_date = "2026-08-19"
workers_dev = true

[vars]
APP_NAME = "Vid.Best"
PUBLIC_BASE_URL = "https://YOUR-DOMAIN.example"
GEMINI_MODEL = "gemini-3.1-flash-lite"
MAX_UPLOAD_BYTES = "104857600"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "video-reviews-db"
database_id = "d1a91eb2-1c41-44b8-aff1-24166f2c91f4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vid-assets"
